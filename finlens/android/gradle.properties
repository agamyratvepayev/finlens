org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# AGP 9 defaults (newDsl + built-in Kotlin) must stay ON together: plugins
# built for AGP >= 9 (package_info_plus 10, google_sign_in 7.2) no longer apply
# the standalone Kotlin Gradle plugin and rely on built-in Kotlin — with these
# off their Kotlin never compiles and the generated registrant fails with
# "cannot find symbol <Plugin>". Setting only one of the two is rejected by AGP.
android.newDsl=true
android.builtInKotlin=true
