org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# The Flutter Gradle plugin (even on Flutter 3.47) cannot apply under AGP 9's
# new DSL, so newDsl stays off. Built-in Kotlin must be ON: plugins built for
# AGP >= 9 (package_info_plus 10, google_sign_in 7.2) no longer apply the
# standalone Kotlin Gradle plugin — with it off their Kotlin never compiles and
# the generated registrant fails with "cannot find symbol <Plugin>".
android.newDsl=false
android.builtInKotlin=true
