# Configures `flutter gen-l10n` (runs automatically on `flutter pub get` because
# `generate: true` is set in pubspec.yaml). ARB files live in lib/l10n; the
# generated AppLocalizations class is written next to them.
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-dir: lib/l10n
output-localization-file: app_localizations.dart
output-class: AppLocalizations
nullable-getter: false
